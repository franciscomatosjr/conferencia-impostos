# Produção: Caddy na frente com HTTPS automático.
# Uso: DOMAIN=seu-dominio.com.br docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  web:
    ports: !reset []

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN=seu-dominio.com.br}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
