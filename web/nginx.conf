# Site estático + proxy reverso para as calculadoras oficiais.
# Só as rotas usadas pelo site ficam expostas; o resto das APIs fica na rede interna do Docker.

limit_req_zone $binary_remote_addr zone=calc:10m rate=5r/s;
limit_req_status 429;

upstream rg     { server regime-regular:8080;   keepalive 16; }
upstream sn     { server simples-nacional:8082; keepalive 16; }
upstream danfse { server danfse:8080;           keepalive 8;  }

server {
    listen 80;

    # IP real do visitante quando houver proxy na frente (Caddy em produção), para o limite de requisições.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-src 'self' blob:; object-src blob:; base-uri 'self'; form-action 'self'" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # O site e as APIs ficam na mesma origem (via proxy); o Origin só faria o CORS do Spring recusar a chamada.
    proxy_set_header Origin "";
    proxy_read_timeout 60s;

    location = /health { access_log off; return 200 "ok\n"; }

    # ---- Regime regular (CBS, IBS e Imposto Seletivo) ----
    location = /api/rg/observabilidade/regime-geral {
        limit_except POST { deny all; }
        limit_req zone=calc burst=10 nodelay;
        proxy_pass http://rg/api/calculadora/observabilidade/regime-geral;
    }
    location = /api/rg/base-calculo/base-calculo-unificada {
        limit_except POST { deny all; }
        limit_req zone=calc burst=10 nodelay;
        proxy_pass http://rg/api/calculadora/base-calculo/base-calculo-unificada;
    }
    location /api/rg/dados-abertos/ {
        limit_except GET { deny all; }
        limit_req zone=calc burst=20 nodelay;
        proxy_pass http://rg/api/calculadora/dados-abertos/;
    }
    location = /api/rg/observabilidade/erros {
        limit_except GET { deny all; }
        proxy_pass http://rg/api/calculadora/observabilidade/erros;
    }

    # ---- Simples Nacional (CBS e IBS) ----
    location = /api/sn/calculo {
        limit_except POST { deny all; }
        limit_req zone=calc burst=10 nodelay;
        proxy_pass http://sn/api/calculadora/observabilidade/simples-nacional;
    }
    location = /api/sn/calculo-unificado {
        limit_except POST { deny all; }
        limit_req zone=calc burst=10 nodelay;
        proxy_pass http://sn/api/calculadora/observabilidade/simples-nacional/nao-assistido;
    }
    location /api/sn/atividades {
        limit_except GET { deny all; }
        limit_req zone=calc burst=20 nodelay;
        proxy_pass http://sn/api/calculadora/simples-nacional/atividades;
    }

    # ---- Gerador do DANFSe ----
    location = /api/danfse {
        limit_except POST { deny all; }
        limit_req zone=calc burst=5 nodelay;
        proxy_pass http://danfse/api/danfse;
    }

    location /api/ { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~* \.(css|js|svg)$ {
        # Sempre revalida (ETag): mudanças no site aparecem na hora, sem baixar de novo o que não mudou.
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
